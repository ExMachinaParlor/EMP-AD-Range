---
- name: Deploy intranet index page
  ansible.builtin.template:
    src: index.html.j2
    dest: "{{ web_docroot }}/index.html"
    owner: www-data
    group: www-data
    mode: "0644"

- name: Ensure Apache is enabled and running
  ansible.builtin.service:
    name: "{{ web_service }}"
    state: started
    enabled: true

- name: Verify site responds locally
  ansible.builtin.uri:
    url: "http://127.0.0.1/"
  register: web_check
  retries: 3
  delay: 5
  until: web_check.status == 200
